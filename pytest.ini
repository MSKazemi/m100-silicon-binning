# Collection is scoped to tests/ on purpose.
#
# analysis/ holds one-off analysis scripts, and one of them (socket_swap_test.py) is named in a way
# pytest collects as a test module even though it is a script: importing it executes the analysis
# and raises. A bare `pytest` from the repository root would then abort collection and run nothing,
# which is exactly the wrong first impression for an artefact whose point is that the tests run.
# CI and docs already use `python -m pytest -q tests/`; this makes the bare invocation do the same.
[pytest]
testpaths = tests
norecursedirs = analysis paper docs reviews .venv .git
